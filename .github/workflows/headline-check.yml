name: Headline Integrity Check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run headline integrity checker
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          DB_PATH: data/headlines.sqlite
          MAX_ITEMS_PER_FEED: 10
          REQUEST_DELAY_MS: 2500
          DRY_RUN: false
        run: npm start

      - name: Commit updated database
        run: |
          if [ -n "$(git status --porcelain data/headlines.sqlite)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/headlines.sqlite
            git commit -m "chore: update headline integrity history"
            git push
          else
            echo "No database changes to commit."
          fi
